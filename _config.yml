# ===== Identidade — editar aqui uma vez, muda em todo o lado =====
title: "Joel Coxi"
tagline: "Dados ao Serviço do Negócio"
description: "Gestor de dados no sector segurador angolano. SQL, Power BI, Python e qualidade de dados aplicados a problemas de negócio."
author: "Joel Coxi"
email: "o-teu-email@exemplo.com"       # EDITAR
url: "https://joelcoxi.github.io"
linkedin: "joel-coxi"
github: "joelcoxi"
youtube: ""                            # EDITAR: endereço do canal

# ===== Interruptor de visibilidade =====
publico: false

# Sinalizar abertura a oportunidades. Com false, o site não menciona
# procura de emprego em lado nenhum. Muda para true só se e quando quiseres
# que isso seja público.
disponivel: false

# ===== Integrações opcionais (vazio = desligada) =====
formspree: ""
goatcounter: ""
cv: ""
retrato: ""                            # ex. "/assets/retrato.jpg" — vazio mostra o painel gráfico

# ===== Motor =====
markdown: kramdown
highlighter: rouge
permalink: /artigos/:title/
timezone: Africa/Luanda

plugins:
  - jekyll-feed
  - jekyll-seo-tag

feed:
  path: /feed.xml

collections:
  videos:
    output: false
  sql:
    output: false
  projectos:
    output: false

defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"

exclude:
  - COMO-PUBLICAR.md
  - README.md
